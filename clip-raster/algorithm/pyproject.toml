[project]
name = "clip-raster"
version = "0.1.0"
description = "Sentinel-2 vegetation and water indices for a SIGPAC parcel"
authors = [{ name = "AgrospAI", email = "agrospai@udl.cat" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "ocean-runner>=0.3.16",
    "oceanprotocol-job-details>=0.5.2",
    "pyproj>=3.7.2",
    "rasterio>=1.5.0",
    "requests>=2.34.2",
    "shapely>=2.1.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=9.0.2"]
