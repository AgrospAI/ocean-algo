# Use this docker-compose to test the algorithm locally
services:
  algorithm:
    build: .
    volumes:
      - ../_data/timeseries-forecast/inputs:/data/inputs:ro
      - ../_data/timeseries-forecast/ddos:/data/ddos:ro
      - ../_data/timeseries-forecast/outputs:/data/outputs:rw
      - ../_data/timeseries-forecast/logs:/data/logs:rw
      - ./algorithm/src:/algorithm/src/
      - ./algorithm/tests:/algorithm/tests/
      - ./entrypoint.sh:/algorithm/entrypoint.sh
    environment:
      DEV: 1
      # TEST: 1
      DIDS: '["timeseries-example"]'
      # secret: ""
      # TRANSFORMATION_DID: ""
