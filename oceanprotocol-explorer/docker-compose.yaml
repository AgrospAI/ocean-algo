# Use this docker-compose to test the algorithm locally
services:
  algorithm:
    build: .
    volumes:
      # Change relative path accordingly !!
      - ../_data/inputs:/algorithm/data/inputs:ro
      - ../_data/ddos:/algorithm/data/ddos:ro
      - ../_data/outputs:/algorithm/data/outputs:rw
      - ./algorithm/src:/algorithm/src/
      - ./algorithm/tests:/algorithm/tests/
      - ./entrypoint.sh:/algorithm/entrypoint.sh
    environment:
      DEV: 1
      TEST: 1
      DIDS: '["eb60f87363a36a5ae5cb8373524a8fd976b0cc5f8c40a706c615b857ae0e2974"]'
      # secret: ""
      # TRANSFORMATION_DID: ""
